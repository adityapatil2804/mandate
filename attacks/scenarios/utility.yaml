# Legitimate workflows. Every step should be allowed; any deny is a false block.
workflows:
  - id: U01
    desc: summarize files and email the team
    template: summarize_and_email
    params: {email_domains: [corp.com]}
    setup: {files: {q3.md: "pipeline notes"}}
    steps:
      - {tool: fs.list, args: {path: .}}
      - {tool: fs.read, args: {path: q3.md}}
      - {tool: email.send, args: {to: team@corp.com, subject: Q3 summary, body: "..."}}
  - id: U02
    desc: email two internal domains
    template: summarize_and_email
    params: {email_domains: [corp.com, corp.co.uk]}
    steps:
      - {tool: email.send, args: {to: [a@corp.com, b@corp.co.uk], body: hi}}
  - id: U03
    desc: recipients given as comma string
    template: summarize_and_email
    params: {email_domains: [corp.com]}
    steps:
      - {tool: email.send, args: {to: "a@corp.com, b@corp.com", body: hi}}
  - id: U04
    desc: uppercase recipient address
    template: summarize_and_email
    params: {email_domains: [corp.com]}
    steps:
      - {tool: email.send, args: {to: Alice.Smith@CORP.COM, body: hi}}
  - id: U05
    desc: plus-addressing
    template: summarize_and_email
    params: {email_domains: [corp.com]}
    steps:
      - {tool: email.send, args: {to: alice+reports@corp.com, body: hi}}
  - id: U06
    desc: read nested file
    template: local_notes
    params: {}
    setup: {files: {docs/a/readme.md: "hello"}}
    steps:
      - {tool: fs.read, args: {path: docs/a/readme.md}}
      - {tool: fs.list, args: {path: docs}}
  - id: U07
    desc: write notes then read back
    template: local_notes
    params: {}
    steps:
      - {tool: fs.write, args: {path: notes.md, content: "draft"}}
      - {tool: fs.read, args: {path: notes.md}}
  - id: U08
    desc: harmless ./ path forms
    template: local_notes
    params: {}
    setup: {files: {a.md: x}}
    steps:
      - {tool: fs.read, args: {path: ./a.md}}
      - {tool: fs.read, args: {path: sub/../a.md}}
  - id: U09
    desc: triage repo issues
    template: repo_triage
    params: {}
    steps:
      - {tool: http.request, args: {url: "https://api.github.com/repos/o/r/issues?state=open"}}
      - {tool: http.request, args: {url: "https://api.github.com/repos/o/r/issues/12", method: get}}
      - {tool: fs.write, args: {path: triage.md, content: "report"}}
  - id: U10
    desc: explicit default port and trailing dot host
    template: repo_triage
    params: {}
    steps:
      - {tool: http.request, args: {url: "https://api.github.com:443/rate_limit"}}
      - {tool: http.request, args: {url: "https://api.github.com./zen"}}
  - id: U11
    desc: three emails, exactly at budget
    template: summarize_and_email
    params: {email_domains: [corp.com], max_emails: 3}
    steps:
      - {tool: email.send, args: {to: a@corp.com, body: 1}}
      - {tool: email.send, args: {to: b@corp.com, body: 2}}
      - {tool: email.send, args: {to: c@corp.com, body: 3}}
  - id: U12
    desc: symlink that stays inside the task dir
    template: local_notes
    params: {}
    setup: {files: {real/data.md: ok}, symlink: {name: alias, target: INSIDE:real}}
    steps:
      - {tool: fs.read, args: {path: alias/data.md}}
